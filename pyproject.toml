[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-web-send"
version = "0.1.3"
description = "Send-only prompts to existing ChatGPT conversations through a signed-in browser"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "chatgpt-web-send contributors"}]
dependencies = ["playwright>=1.48,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
chatgpt-web-send = "chatgpt_web_send.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
